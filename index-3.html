<style>
:root{--bg:#f4f8f5;--card:#fff;--tx:#1b2b22;--mut:#6b7d72;--pri:#0f7a4a;--pri2:#e3f3ea;--ok:#0f7a4a;--no:#c0392b;--pr:#c27c0e;--bd:#d9e5dd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--card:#17261d;--tx:#e6f1ea;--mut:#98ad9f;--pri:#3ec283;--pri2:#1d3528;--ok:#3ec283;--no:#ef6b5d;--pr:#e8a93a;--bd:#2a3f32}}
:root[data-theme="dark"]{--bg:#0f1a14;--card:#17261d;--tx:#e6f1ea;--mut:#98ad9f;--pri:#3ec283;--pri2:#1d3528;--ok:#3ec283;--no:#ef6b5d;--pr:#e8a93a;--bd:#2a3f32}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Bengali","Kalpurush","SolaimanLipi",system-ui,sans-serif;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
header{padding:18px 16px 8px;text-align:center}
header h1{margin:0;font-size:22px;color:var(--pri)}
header p{margin:4px 0 0;color:var(--mut);font-size:13px}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--mut)}
.add{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.add summary{cursor:pointer;font-weight:600;color:var(--pri)}
input,select{width:100%;padding:11px;margin-top:8px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer}
.btn{width:100%;margin-top:10px;padding:12px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:600}
.hint{font-size:12.5px;color:var(--mut);text-align:center;margin:6px 0}
.item{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:8px;border-inline-start:5px solid var(--bd);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.item.done{border-inline-start-color:var(--ok)}.item.not{border-inline-start-color:var(--no)}.item.promise{border-inline-start-color:var(--pr)}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--pri2);opacity:.9;pointer-events:none}
.item.p1 .fill{background:rgba(255,190,70,.38)}
.item.hold .fill{width:100%;transition:width 3s linear}
.body{position:relative;padding-inline-end:40px;line-height:1.7;font-size:16px}
.body .nm{font-weight:700;font-size:17px}
.body .st{font-weight:600}
.st.done{color:var(--ok)}.st.not{color:var(--no)}.st.promise{color:var(--pr)}
.acts{position:relative;display:flex;justify-content:flex-end;margin-top:6px}
.pb{padding:7px 12px;border:1px solid var(--pr);background:var(--bg);color:var(--pr);border-radius:999px;font-size:13px;font-weight:600}
.pb.on{background:var(--pr);color:#fff;opacity:.9}
.msg{margin:8px 0;padding:10px 14px;border-radius:12px;background:var(--pri2);border:1px solid var(--bd);color:var(--pri);font-weight:700;text-align:center}
.trow{display:block;width:100%;text-align:start;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px;margin-top:8px;font-weight:600}
.trow.on{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri)}
.trow canvas{display:block;width:100%;height:130px;border-radius:8px;margin-bottom:6px;pointer-events:none}
.empty{text-align:center;color:var(--mut);padding:30px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{border:0;background:none;color:var(--mut);padding:8px 2px;font-size:11.5px;line-height:1.3}
nav button b{display:block;font-size:22px;font-weight:800;color:inherit}
nav button.on{color:var(--pri);background:var(--pri2)}
#gear{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:6;width:42px;height:42px;border-radius:50%;border:1px solid var(--bd);background:var(--card);font-size:20px;line-height:1}
.call{display:inline-block;margin-inline-start:8px;padding:2px 12px;border-radius:999px;background:var(--pri);color:#fff;font-size:13.5px;font-weight:600;text-decoration:none;user-select:none;-webkit-user-select:none}
.item.done{background:radial-gradient(ellipse at 50% -10%,rgba(255,238,170,.55),transparent 62%),radial-gradient(ellipse at 100% 110%,rgba(120,232,185,.38),transparent 58%),radial-gradient(ellipse at 0% 100%,rgba(190,170,255,.18),transparent 55%),var(--card);border:1px solid rgba(255,208,90,.85);animation:breathe 5.5s ease-in-out infinite}
.item.done::before{content:"";position:absolute;inset:-60%;z-index:0;pointer-events:none;background:conic-gradient(from 0deg,rgba(255,226,140,0),rgba(255,226,140,.30),rgba(140,240,200,0),rgba(150,200,255,.22),rgba(255,226,140,0));filter:blur(28px);animation:spin 22s linear infinite}
.item.done::after{content:"";position:absolute;left:50%;top:-30%;width:140%;height:90%;transform:translateX(-50%);z-index:0;pointer-events:none;background:repeating-conic-gradient(from 0deg at 50% 0%,rgba(255,236,170,.22) 0deg 4deg,transparent 4deg 14deg);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);animation:rays 7s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 10px 2px rgba(255,208,90,.35),0 0 26px 6px rgba(110,230,180,.18)}50%{box-shadow:0 0 22px 6px rgba(255,208,90,.65),0 0 48px 14px rgba(110,230,180,.34)}}
